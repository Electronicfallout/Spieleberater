name: Schachtelbilder laden
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/images.json", "tools/fetch_images.py"]
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python tools/fetch_images.py
      - name: Bilder committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Schachtelbilder aktualisiert"
          git push
